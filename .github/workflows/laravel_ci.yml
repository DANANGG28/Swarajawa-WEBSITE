# Deploy produksi ditangani Dokploy (Provider GitHub, Branch = main, Trigger Type
# "On Push"), jadi workflow ini sengaja hanya menjalankan CI.
#
# Percobaan memanggil deploy webhook Dokploy dari sini sudah dilakukan dan ditolak
# dengan HTTP 301 "Branch Not Match": endpoint itu menerima payload push dari Git
# provider (berisi ref), bukan POST kosong. Kalau nanti deploy ingin dijalankan
# dari Actions (mis. supaya menunggu tes hijau), pakai API Dokploy
# (`POST /api/application.deploy` + header x-api-key + applicationId) dan ubah
# Trigger Type aplikasi supaya tidak dobel build dengan jalur On Push.
name: Laravel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP 8.4 + PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Database tes memakai PostgreSQL, sama seperti produksi (Supabase PG 17).
    # Nilai di phpunit.xml (sqlite) tidak dipaksa, jadi variabel di bawah ini menang.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
    - uses: actions/checkout@v4
      with:
        # Perlu riwayat penuh untuk membandingkan perubahan file (langkah Pint).
        fetch-depth: 0

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        # Mengikuti ekstensi di image produksi (Dockerfile, stage runtime).
        extensions: mbstring, fileinfo, pdo, pdo_pgsql, pgsql, gd, zip, bcmath, intl, exif, pcntl
        ini-values: memory_limit=512M
        coverage: none

    - name: Cache Composer
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install dependencies (Composer)
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Validate composer.json
      run: composer validate --strict --no-check-publish

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    # Aset harus dibangun sebelum tes: view memanggil @vite, dan tanpa
    # public/build/manifest.json semua tes yang merender halaman akan gagal.
    - name: Build frontend (Vite + Tailwind)
      run: |
        npm ci
        npm run build

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run migrations from scratch
      run: php artisan migrate --force

    # Container produksi menjalankan config:cache saat start (docker/entrypoint.sh).
    # Nilai config yang tidak bisa diserialisasi (mis. objek) baru ketahuan di sini.
    # route:cache sengaja tidak diperiksa: rute closure membuatnya selalu gagal,
    # termasuk di produksi, dan kegagalan itu hanya dicatat sebagai peringatan.
    - name: Cek config:cache seperti saat start container
      run: |
        php artisan config:cache
        php artisan config:clear

    - name: Check code style on changed PHP files (Pint)
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
        elif [ "${{ github.event_name }}" = "push" ]; then
          RANGE="${{ github.event.before }}...HEAD"
        else
          RANGE="origin/main...HEAD"
        fi

        BASE_REF="${RANGE%%...*}"
        if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
          echo "$BASE_REF tidak ada di checkout ini; memakai origin/main sebagai pembanding."
          RANGE="origin/main...HEAD"
        fi

        CHANGED=/tmp/changed-php.txt
        git diff --name-only --diff-filter=ACMR "$RANGE" -- '*.php' > "$CHANGED" || true

        if [ ! -s "$CHANGED" ]; then
          echo "Tidak ada file PHP yang berubah; pemeriksaan gaya dilewati."
          exit 0
        fi

        echo "File yang diperiksa:"
        cat "$CHANGED"
        xargs -d '\n' -a "$CHANGED" vendor/bin/pint --test

    - name: Run tests
      run: php artisan test
